version: 2
updates:
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
    groups:
      azure-sdk:
        patterns: ["@azure/*"]
      tooling:
        patterns: ["eslint*", "@eslint/*", "typescript*"]
    ignore:
      # Type definitions must match the Node.js major the function runs on (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /tools
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
