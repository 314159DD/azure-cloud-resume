# Quality gate for pull requests and main. Runs without any Azure access: ARM authorizes what-if like a
# deployment, so a pull request that could preview changes could also deploy them. The what-if preview
# runs in the protected deploy workflow instead.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Documentation-only changes do not need a test run or a deployment.
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch: # a manual CI run on main also triggers a deployment

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, typecheck, test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  integration:
    name: API integration (Cosmos DB emulator)
    runs-on: ubuntu-24.04
    services:
      cosmos:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
        ports:
          - 8081:8081
          - 8080:8080
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Wait for the emulator
        run: |
          for i in $(seq 60); do
            curl -fsS http://localhost:8080/ready > /dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "::error::Cosmos DB emulator not ready after 120 s"; exit 1
      - run: npm run test:integration
        env:
          COSMOS_EMULATOR_ENDPOINT: http://localhost:8081

  infra:
    name: Infrastructure (Bicep, PSRule for Azure)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bicep build and lint
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep
      - name: PSRule for Azure (Well-Architected rules)
        uses: microsoft/ps-rule@46451b8f5258c41beb5ae69ed7190ccbba84112c # v2.9.0
        with:
          modules: PSRule.Rules.Azure
          inputType: repository
          option: ps-rule.yaml
          summary: true
        env:
          BUDGET_ALERT_EMAIL: ci@example.invalid # placeholder so the parameter file can be expanded
