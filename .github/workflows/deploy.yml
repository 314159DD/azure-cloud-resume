# Continuous deployment: staging first, production only after staging passed its smoke test.
# Runs after CI succeeded on main (after a push or a manual CI run) and deploys exactly the commit CI tested.
# Both GitHub environments only accept the main branch; production also needs a required reviewer. The
# what-if preview runs inside each environment, after any approval, because it needs that environment's
# deploy identity and its write permission (see ADR 3).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  staging:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    uses: ./.github/workflows/deploy-environment.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: staging
      ref: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit

  production:
    needs: staging
    uses: ./.github/workflows/deploy-environment.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: production
      ref: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
